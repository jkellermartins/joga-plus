<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #000;
    --bg-card: #111;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.18);
    --text: #fff;
    --text-muted: rgba(255,255,255,0.55);
    --text-dim: rgba(255,255,255,0.35);
    --neon: #C5F73A;
    --neon-glow: rgba(197,247,58,0.45);
    --radius: 14px;
    --transition: 320ms cubic-bezier(0.22,1,0.36,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(197,247,58,0.1), transparent 60%),
      radial-gradient(900px 500px at 50% 100%, rgba(197,247,58,0.05), transparent 60%),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 22px;
  }

  .shell {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .brand {
    display: inline-block;
    margin-bottom: 56px;
  }
  .brand img {
    height: 38px;
    width: auto;
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.35));
  }

  .check {
    width: 88px; height: 88px;
    margin: 0 auto 32px;
    border-radius: 50%;
    background: rgba(197,247,58,0.1);
    border: 1px solid rgba(197,247,58,0.45);
    display: grid;
    place-items: center;
    color: var(--neon);
    box-shadow: 0 0 50px rgba(197,247,58,0.3);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(197,247,58,0.25); }
    50%      { box-shadow: 0 0 70px rgba(197,247,58,0.55); }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(36px, 7vw, 56px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin-bottom: 18px;
    text-shadow: 0 0 14px rgba(255,255,255,0.18), 0 0 38px rgba(255,255,255,0.08);
  }
  h1 em { font-style: normal; color: var(--neon); }

  .lede {
    font-size: 17px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 460px;
    margin: 0 auto 40px;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 360px;
    margin: 0 auto;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 24px;
    border-radius: 100px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all var(--transition);
  }
  .btn-whatsapp {
    background: #25D366;
    color: #000;
  }
  .btn-whatsapp:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 30px rgba(37,211,102,0.3);
  }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line-strong);
  }
  .btn-ghost:hover {
    border-color: var(--text);
    background: rgba(255,255,255,0.04);
  }

  .footer-note {
    margin-top: 56px;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-family: 'Space Grotesk', sans-serif;
  }
  .footer-note a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color var(--transition);
  }
  .footer-note a:hover { color: var(--neon); }

  @media (max-width: 540px) {
    .brand { margin-bottom: 36px; }
    .check { width: 72px; height: 72px; margin-bottom: 24px; }
  }
</style>
</head>
