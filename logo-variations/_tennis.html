<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;}
  .logo{width:1200px;height:450px;background:#000;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:'Montserrat',system-ui,sans-serif;}
  .bg{position:absolute;inset:0;z-index:0;pointer-events:none;}
  .mark{position:relative;z-index:2;display:flex;align-items:center;gap:14px;}
  .word{font-weight:900;font-size:220px;color:#fff;letter-spacing:-6px;line-height:1;}
  .plus{font-weight:900;font-size:220px;color:#9EFF38;line-height:1;margin-left:-4px;}
</style>
</head>
<body>
<div class="logo">
  <svg class="bg" viewBox="0 0 1200 450" preserveAspectRatio="xMidYMid slice">
    <!-- Tennis court lines across bottom, big lime tennis ball top-right -->
    <!-- court (birds-eye style, flat) -->
    <g opacity="0.16" stroke="#ffffff" fill="none" stroke-width="2">
      <rect x="80" y="360" width="1040" height="60"/>
      <line x1="600" y1="360" x2="600" y2="420"/>
      <line x1="300" y1="360" x2="300" y2="420"/>
      <line x1="900" y1="360" x2="900" y2="420"/>
    </g>
    <!-- Big tennis ball top-right, bleeding off — in actual tennis-ball lime -->
    <g transform="translate(1090,80)" opacity="0.9">
      <circle r="200" fill="#9EFF38" opacity="0.22"/>
      <circle r="200" fill="none" stroke="#9EFF38" stroke-width="3" opacity="0.55"/>
      <!-- iconic curved seams -->
      <path d="M -200,0 C -140,-140 60,-190 200,-80"
            fill="none" stroke="#ffffff" stroke-width="4" opacity="0.55"/>
      <path d="M -200,0 C -140,140 60,190 200,80"
            fill="none" stroke="#ffffff" stroke-width="4" opacity="0.55"/>
    </g>
    <!-- Small tennis ball bottom-left for balance -->
    <g transform="translate(110,340)" opacity="0.8">
      <circle r="32" fill="#9EFF38" opacity="0.28"/>
      <circle r="32" fill="none" stroke="#9EFF38" stroke-width="2.5"/>
      <path d="M -30,-10 Q -12,-22 10,-18 T 30,-8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <path d="M -30,10 Q -12,22 10,18 T 30,8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    </g>
  </svg>
  <div class="mark">
    <span class="word">JOGA</span>
    <span class="plus">+</span>
  </div>
</div>
</body>
</html>
